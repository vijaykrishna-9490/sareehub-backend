spring.application.name=sareehub-backend
server.port=${PORT:8080}

# ---- MySQL ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sareehub_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
app.jwt.secret=${APP_JWT_SECRET:sareehub_super_secret_key_change_this_in_production_min_256_bits}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ---- CORS ----
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- File upload ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Cloudinary ----
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}

# ---- Razorpay ----
razorpay.key-id=${RAZORPAY_KEY_ID:your_key_id}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:your_key_secret}